services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel_rivage
      POSTGRES_USER: hotel_rivage
      POSTGRES_PASSWORD: hotel_rivage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_rivage -d hotel_rivage"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hotel_rivage_postgres:/var/lib/postgresql/data

volumes:
  hotel_rivage_postgres:
